[package]
name = "xarxa-sdk-rs"
version = "0.1.0"
edition = "2024"
authors = ["Xarxa Systems <contact@xarxa.io>"]
repository = "https://github.com/xarxa-systems/xarxa-sdk-rs"
description = "Xarxa Rust SDK"
license = "MIT"
readme = "README.md"

[lib]
# proc-macro = true

[dependencies]
wit-bindgen = "0.46.0"
anyhow = { version = "1.0.100", default-features = false }
serde = { version = "1.0.226", features = ["derive"]}
bincode = "1.3.3"
# syn = { version = "2.0.106", features = ["full"] }
# quote = "1.0.40"
# proc-macro2 = "1.0.101"

[dev-dependencies]
anyhow = { version = "1.0.100", default-features = false }

[[example]]
name = "basic"
path = "examples/basic.rs"
crate-type = ["cdylib"]
