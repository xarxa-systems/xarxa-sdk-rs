[package]
name = "xarxa-sdk-rs"
version = "0.3.1"
edition = "2024"
authors = ["Xarxa Systems <contact@xarxa.io>"]
repository = "https://github.com/xarxa-systems/xarxa-sdk-rs"
description = "Xarxa Rust SDK"
license = "MIT"
readme = "README.md"

[lib]
# proc-macro = true

[dependencies]
wit-bindgen = "0.46.0"
anyhow = { version = "1.0.100", default-features = false }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
bincode = "2.0.1"


[dev-dependencies]
anyhow = { version = "1.0.100", default-features = false }

[[example]]
name = "basic"
path = "examples/basic.rs"
crate-type = ["cdylib"]
